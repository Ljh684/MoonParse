name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Update Registry
        run: moon update
      - name: Moon Info (deny interface diff)
        run: moon info && git diff --exit-code
      - name: Moon Check (deny warnings)
        run: moon check --deny-warn
      - name: Moon Format Check
        run: moon fmt --check
      - name: Moon Test (deny warnings)
        run: moon test --deny-warn
      - name: Moon Build
        run: moon build
